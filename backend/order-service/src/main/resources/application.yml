server:
  port: ${PORT:8083}
  shutdown: graceful

spring:
  application:
    name: order-service
  datasource:
    url: jdbc:mariadb://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:sportshop_orders}
    username: ${DB_USER:orders_svc}
    password: ${DB_PASSWORD:orders_pass}
    hikari:
      maximum-pool-size: 10
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  jackson:
    time-zone: UTC

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-at-least-32-bytes-long!!}
    issuer: sportshop
  internal:
    api-key: ${INTERNAL_API_KEY:dev-only-internal-key}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8080}
  catalog:
    base-url: ${CATALOG_SERVICE_URL:http://localhost:8082}
    connect-timeout: 2s
    read-timeout: 5s
  shipping:
    flat-rate: 5.00
    free-threshold: 75.00
  cart:
    max-quantity-per-item: 10

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

server:
  port: ${PORT:8081}
  shutdown: graceful

spring:
  application:
    name: user-service
  datasource:
    url: jdbc:mariadb://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:sportshop_users}
    username: ${DB_USER:users_svc}
    password: ${DB_PASSWORD:users_pass}
    hikari:
      maximum-pool-size: 10
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
  jackson:
    time-zone: UTC

app:
  jwt:
    # Solo para desarrollo local: en docker-compose/producción se inyecta con la variable JWT_SECRET.
    secret: ${JWT_SECRET:dev-only-secret-change-me-at-least-32-bytes-long!!}
    issuer: sportshop
    expiration: ${JWT_EXPIRATION:60m}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8080}
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  password-reset:
    token-ttl: 30m
  login:
    max-failed-attempts: 5
    lock-duration: 15m
  mail:
    enabled: ${MAIL_ENABLED:false}
    from: "SportShop <no-reply@sportshop.local>"

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  health:
    mail:
      enabled: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html

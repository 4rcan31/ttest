# nginx cumple dos funciones:
#  1) Sirve la SPA de React (estáticos con caché agresiva para los assets con hash).
#  2) Actúa como API Gateway: enruta cada prefijo /api/* a su microservicio.
#     Los endpoints /internal/* (servicio-a-servicio) NO se publican.

upstream user_service    { server user-service:8081; }
upstream catalog_service { server catalog-service:8082; }
upstream order_service   { server order-service:8083; }

# Mitigación de fuerza bruta en autenticación: 10 solicitudes/minuto por IP (ráfaga de 5).
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;

server {
    listen 80;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    client_max_body_size 1m;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    include /etc/nginx/snippets/security-headers.conf;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;

    # Errores generados por el propio gateway con el mismo formato JSON que los microservicios.
    error_page 429 = @rate_limited;
    error_page 502 503 504 = @service_unavailable;

    location @rate_limited {
        default_type application/json;
        return 429 '{"status":429,"code":"TOO_MANY_REQUESTS","message":"Demasiados intentos. Espere un minuto e intente nuevamente."}';
    }

    location @service_unavailable {
        default_type application/json;
        return 503 '{"status":503,"code":"SERVICE_UNAVAILABLE","message":"El servicio no está disponible en este momento. Intente nuevamente en unos minutos."}';
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # ---- user-service ----
    location ~ ^/api/auth/(login|register|forgot-password|reset-password)$ {
        limit_req zone=auth_limit burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://user_service;
    }
    location /api/auth/  { proxy_pass http://user_service; }
    location /api/users/ { proxy_pass http://user_service; }

    # ---- catalog-service (catálogo público; las imágenes llegan con Cache-Control desde el servicio) ----
    location /api/products { proxy_pass http://catalog_service; }

    # ---- order-service ----
    location /api/cart   { proxy_pass http://order_service; }
    location /api/orders { proxy_pass http://order_service; }
    location /api/admin/ { proxy_pass http://order_service; }

    location /api/ {
        default_type application/json;
        return 404 '{"status":404,"code":"NOT_FOUND","message":"Recurso no encontrado"}';
    }

    # La API interna entre servicios nunca se publica hacia internet.
    location /internal/ { return 404; }
    location /actuator/ { return 404; }

    # ---- SPA ----
    location /assets/ {
        expires 1y;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
